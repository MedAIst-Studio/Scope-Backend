info:
  contact: {}
  description: |2-

    ## How to use the API
    1- Click which endpoint you want to use.
    2- Click "Try it out" button.
    3- Add your request body or your parameters which are showed and required by the endpoint.
    4- Click "Execute" button.
    5- You will see the response.

    Some endpoints require authentication. In this case, you need to log in first.
    I created two types of users for this project: admin and regular user.
    Just send a POST request as below at [here](http://localhost:3000/swagger/index.html/).
    After login, you will get a JWE token in cookies.
    If you're using cookie-based auth, the cookie will be sent automatically.
    Alternatively, you can use Bearer Token authentication via the "Authorize" button.

    ### Login Request For Admin
    ```json
    {
    "email": "admin@admin.com",
    "password": "admin123"
    }
    ```

    ### Login Request For User
    ```json
    {
    "email": "user@user.com",
    "password": "user1234"
    }
    ```

    ## Error Handling
    All error responses will follow this JSON format:

    ```json
    {
    "message": string,
    "code": int
    }
    ```
    ### Example
    ```json
    {
    "message": "invalid request",
    "code": 400
    }
    ```

    ## Reminder
    I did not use `/api` prefix for the endpoint routes. Because I love to host my API on "api" subdomain.
    Status code with `2xx` is a success code.
    Status code with `4xx` is a client error code.
    Status code with `5xx` is a server error code.
  title: MedAIist-Backend API
  version: "1.0"
paths:
  /api/auth/exchange:
    post:
      consumes:
      - application/json
      parameters:
      - description: Exchange Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers_auth.ExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers_auth.ExchangeResponse'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Exchange OAuth2 tokens
  /api/auth/oauth/mobile:
    post:
      consumes:
      - application/json
      description: Authenticate user via Google or Facebook mobile tokens.
      parameters:
      - description: Mobile Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/infrastructure_oauth.MobileLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infrastructure_oauth.OAuthTokens'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Mobile OAuth Login
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user or admin
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers_auth.LoginResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Removes the refresh token from the database.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
      summary: Logout user
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Generate a new access token using a valid refresh token.
        The API takes refresh token from req body the sends  a new access token.
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers_auth.RefreshTokenResponse'
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      summary: Refresh access token
      tags:
      - Auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Signup a new user
      parameters:
      - description: Signup request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers_auth.SignupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers_auth.SignupResponse'
        "400":
          description: Bad Request
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      summary: Signup
      tags:
      - Auth
  /chats:
    get:
      consumes:
      - application/json
      description: Retrieves a list of chats associated with the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ChatResponseDTO'
            type: array
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Retrieve chats for the authenticated user
      tags:
      - Chats
  /chats/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a chat by its ID.
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete Chat
      tags:
      - Chats
    get:
      consumes:
      - application/json
      description: Retrieves all messages associated with a specific chat by its ID.
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.MessageDTO'
            type: array
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Retrieve messages for a specific chat
      tags:
      - Chats
    patch:
      consumes:
      - application/json
      - application/json
      description: |-
        Updates the title of a chat by its ID.
        Updates the title of a chat by its ID.
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      - description: New Title
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateChatRequest'
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      - description: New Title
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateChatRequest'
      produces:
      - application/json
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      - BearerAuth: []
      summary: Update Chat Title
      tags:
      - Chats
      - Chats
  /files:
    get:
      consumes:
      - application/json
      description: Retrieves a list of files associated with the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.FileResponseDTO'
            type: array
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Retrieve files for the authenticated user
      tags:
      - Files
  /files/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a file and its associated data
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete a file
      tags:
      - Files
    get:
      consumes:
      - application/json
      description: Retrieve a file by its ID
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get File
      tags:
      - files
  /files/{id}/extract-notes:
    post:
      consumes:
      - application/json
      description: Extract text notes from an uploaded image file using OCR.
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ExtractNotesResponse'
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Extract notes from image
      tags:
      - Files
  /files/{id}/notes:
    put:
      consumes:
      - application/json
      description: Update the extracted text for a file and re-index it.
      parameters:
