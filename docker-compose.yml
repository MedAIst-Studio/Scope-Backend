services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: scope_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - scope_net

  api:
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - .:/app
      - go-mod:/go/pkg/mod
    ports:
      - "8080:8080"
    command: ["go", "run", "./cmd/main.go"]
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - scope_net

networks:
  scope_net:
    driver: bridge

volumes:
  go-mod:
  db-data:
